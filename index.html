    <script type="text/markdown"># Slate Markdown Editor

This standalone page uses the same reusable **Slate 0.15.0** component used by Wire.

## Editing

- Use **Edit** for Obsidian-style Live Preview.
- Use **Preview** for rendered Markdown.
- Use **Source** for the complete Markdown document.
- Open the outline from the three-line navigation control.
- Use the formatting controls for common Markdown operations.

## Checklist

- [ ] Try a normal task
- [ ] Add an image or file
- [ ] Open the document outline

## Media

Paste or drop files into the editor. In standalone mode they are stored locally in IndexedDB and referenced with `attachment://...` URLs.

## Host integration

See `examples/host-controlled.html` and `README.md` for embedding Slate inside another web application.
